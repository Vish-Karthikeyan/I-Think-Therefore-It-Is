[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea"
version = "0.1.0"
description = "IDEA: Identity-Dependent Evidence Accommodation - dataset, analysis and elicitation code"
requires-python = ">=3.10"
dependencies = [
  # analysis (analysis/rq1.py, analysis/rq2.py; torch runs on the CPU here)
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "torch>=2.1",
  # elicitation (elicit.py)
  "pyyaml>=6.0",
  "httpx>=0.25",
  "python-dotenv>=1.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
# open-weight models on a GPU: elicit.py --backend hf and analysis/rq3.py
hf = ["transformers>=4.56", "accelerate>=0.30", "safetensors>=0.4", "scikit-learn>=1.3", "pyarrow>=12"]
# RQ3 capability audit (MMLU-Pro, BBQ through lm-eval; SycEval items from MMLU)
audit = ["lm-eval>=0.4.3", "datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]
