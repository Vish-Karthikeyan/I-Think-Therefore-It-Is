[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea"
version = "0.1.0"
description = "IDEA: Identity-Dependent Evidence Accommodation - diagnostic suite and steering toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "httpx>=0.25",
  "python-dotenv>=1.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "pyarrow>=12",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.56", "accelerate>=0.30", "safetensors>=0.4"]
bayes = ["bambi>=0.13"]
audit = ["lm-eval>=0.4.3", "datasets>=2.18"]
dev = ["pytest>=7"]

[project.scripts]
idea = "idea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idea = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
