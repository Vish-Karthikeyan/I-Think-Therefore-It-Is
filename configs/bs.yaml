# Belief-strength experiment (exploratory, 2026-11-16; docs/BELIEF_STRENGTH_PLAN.md). Same seed and design as
# main.yaml, so the same trials. Levels run fresh on the same trials: *_bs0 original "I think", *_bs3 weak
# "I'm not sure, but I think" (chosen after the probe: level 1 "I'm inclined to think" was not rated less certain),
# *_bs2 strong "I'm certain that". Open models: the 0/3 trial-id third (as P6). GPT-4o: the 0/12 twelfth inside it
# ($10 total budget, user 2026-11-16; its original level must be re-run because its answers drifted since 2026-11-11).
name: bs
seed: 20261110
models: &id001
- olmo_instruct_bs0
- olmo_instruct_bs3
- olmo_instruct_bs2
- llama_bs0
- llama_bs3
- llama_bs2
- tulu_final_bs0
- tulu_final_bs3
- tulu_final_bs2
- phi4_bs0
- phi4_bs3
- phi4_bs2
- gpt_bs0
- gpt_bs3
- gpt_bs2
design:
  q_values:
  - 0.58
  - 0.6
  - 0.62
  n_range:
  - 10
  - 30
  rate_range:
  - 0.2
  - 0.8
  n_neutral: 75
  n_belief: 318
  tier1_scale: 0.4
  items_per_topic_dir: 30
  p_match: 0.75
  complement_frac: 0.0
  calibration_frac: 0.06
elicit:
  max_cost_per_run: 10
  batch_size: 16
  batch_size_by_model:
    olmo_instruct_bs0: 32
    olmo_instruct_bs3: 32
    olmo_instruct_bs2: 32
    llama_bs0: 32
    llama_bs3: 32
    llama_bs2: 32
    tulu_final_bs0: 16
    tulu_final_bs3: 16
    tulu_final_bs2: 16
    phi4_bs0: 16
    phi4_bs3: 16
    phi4_bs2: 16
  coverage_min: 0.9
  sample_k: 10
  temperature: 1.0
  concurrency: 24
  chunk: 512
  api_key_env_by_model:
    gpt_bs0: OPENROUTER_API_KEY_CLAUDE
    gpt_bs3: OPENROUTER_API_KEY_CLAUDE
    gpt_bs2: OPENROUTER_API_KEY_CLAUDE
  subset_by_model:
    olmo_instruct_bs0: 0/3
    olmo_instruct_bs3: 0/3
    olmo_instruct_bs2: 0/3
    llama_bs0: 0/3
    llama_bs3: 0/3
    llama_bs2: 0/3
    tulu_final_bs0: 0/3
    tulu_final_bs3: 0/3
    tulu_final_bs2: 0/3
    phi4_bs0: 0/3
    phi4_bs3: 0/3
    phi4_bs2: 0/3
    gpt_bs0: 0/12
    gpt_bs3: 0/12
    gpt_bs2: 0/12
  belief_trials_only: *id001
  retest_subset_by_model:
    olmo_instruct_bs0: 300
    olmo_instruct_bs3: 300
    olmo_instruct_bs2: 300
    llama_bs0: 300
    llama_bs3: 300
    llama_bs2: 300
    tulu_final_bs0: 300
    tulu_final_bs3: 300
    tulu_final_bs2: 300
    phi4_bs0: 300
    phi4_bs3: 300
    phi4_bs2: 300
    gpt_bs0: 300
    gpt_bs3: 300
    gpt_bs2: 300
  no_calibration: *id001
capture:
  models: []
