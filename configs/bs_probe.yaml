# Belief-strength experiment (exploratory, 2026-11-16; docs/BELIEF_STRENGTH_PLAN.md). Same seed and design
# as main.yaml, so the same trials. *_bs1 = weak hedge, *_bs2 = strong, *_bs0 = original prompt (reproducibility).
# Open models: the 0/3 trial-id third (as P6); GPT-4o: the 0/9 ninth inside it ($10 total budget, user 2026-11-16).
