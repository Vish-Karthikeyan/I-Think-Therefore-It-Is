# Third-party belief control (exploratory, 2026-11-16; reviewer request, after BASIL's agent-belief baseline).
# Same seed/design as main.yaml -> same trials. *_bs6: "<Name> thinks <clause>.", *_bs7: "<Name> is certain that
# <clause>." (names Alex/Jordan/Taylor/Casey rotated by trial id); *_nb: fresh no-belief baseline (b = 0 trials).
# Compared with the user levels in configs/bs.yaml (*_bs0 "I think", *_bs2 "I'm certain that") on the same trials.
# GPT-4o: third-party "thinks" only, on the 0/12 twelfth ($10 total budget, user 2026-11-16); run in two shards.
name: tp
seed: 20261110
models: &id001
- olmo_instruct_bs6
- olmo_instruct_bs7
- llama_bs6
- llama_bs7
- tulu_final_bs6
- tulu_final_bs7
- phi4_bs6
- phi4_bs7
- olmo_instruct_nb
- llama_nb
- tulu_final_nb
- phi4_nb
- gpt_bs6
design:
  q_values:
  - 0.58
  - 0.6
  - 0.62
  n_range:
  - 10
  - 30
  rate_range:
  - 0.2
  - 0.8
  n_neutral: 75
  n_belief: 318
  tier1_scale: 0.4
  items_per_topic_dir: 30
  p_match: 0.75
  complement_frac: 0.0
  calibration_frac: 0.06
elicit:
  max_cost_per_run: 2.6
  batch_size: 16
  batch_size_by_model:
    olmo_instruct_bs6: 32
    olmo_instruct_bs7: 32
    llama_bs6: 32
    llama_bs7: 32
    tulu_final_bs6: 16
    tulu_final_bs7: 16
    phi4_bs6: 16
    phi4_bs7: 16
    olmo_instruct_nb: 32
    llama_nb: 32
    tulu_final_nb: 16
    phi4_nb: 16
  coverage_min: 0.9
  sample_k: 10
  temperature: 1.0
  concurrency: 24
  chunk: 512
  api_key_env_by_model:
    gpt_bs6: OPENROUTER_API_KEY_CLAUDE
  subset_by_model:
    olmo_instruct_bs6: 0/3
    olmo_instruct_bs7: 0/3
    llama_bs6: 0/3
    llama_bs7: 0/3
    tulu_final_bs6: 0/3
    tulu_final_bs7: 0/3
    phi4_bs6: 0/3
    phi4_bs7: 0/3
    olmo_instruct_nb: 0/3
    llama_nb: 0/3
    tulu_final_nb: 0/3
    phi4_nb: 0/3
    gpt_bs6: 0/12
  belief_trials_only:
  - olmo_instruct_bs6
  - olmo_instruct_bs7
  - llama_bs6
  - llama_bs7
  - tulu_final_bs6
  - tulu_final_bs7
  - phi4_bs6
  - phi4_bs7
  - gpt_bs6
  no_belief_trials_only:
  - olmo_instruct_nb
  - llama_nb
  - tulu_final_nb
  - phi4_nb
  retest_subset_by_model:
    olmo_instruct_bs6: 300
    olmo_instruct_bs7: 300
    llama_bs6: 300
    llama_bs7: 300
    tulu_final_bs6: 300
    tulu_final_bs7: 300
    phi4_bs6: 300
    phi4_bs7: 300
    olmo_instruct_nb: 300
    llama_nb: 300
    tulu_final_nb: 300
    phi4_nb: 300
    gpt_bs6: 300
  no_calibration: *id001
capture:
  models: []
