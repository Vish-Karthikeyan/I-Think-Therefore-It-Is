# Pilot (Section 4 notes, step 5): a few hundred trials per model to check coverage,
# repeatability, the P(H1)+P(H0) sum, the spread of g, readout calibration, starting
# beliefs per condition, and the omega histogram. Then `idea power` and `idea prereg`.
name: pilot
seed: 20261109
models: [olmo_base, olmo_sft, olmo_dpo, olmo_instruct, llama, gpt, claude]
design:
  # Evidence tables approved 2026-11-10 (see the 'IDEA pilot design changes' doc)
  q_values: [0.58, 0.60, 0.62]
  n_range: [10, 30]
  rate_range: [0.20, 0.80]
  scale: 0.04            # ~ 30 trials per (group, cue type) in Tier 2 -> ~1,900 trials/model
  items_per_topic_dir: 12
  complement_frac: 0.25  # P(H0) sum check
  calibration_frac: 0.15 # sampling readout on open models
elicit:
  max_cost_per_run: 15   # USD; each command refuses to start above this estimate and stops when spend reaches it
  batch_size: 32   # L40S 48 GB
  coverage_min: 0.9
  sample_k: 10
  sample_k_by_model: {claude: 3}          # trials: Claude has no logprobs; 3 samples per question (approved 2026-11-10)
  stance_sample_k_by_model: {claude: 5}   # stance + vignette check: 5 samples, reusing answers already paid for
  temperature: 1.0
  concurrency: 16
capture:
  models: []             # no activations in the pilot
